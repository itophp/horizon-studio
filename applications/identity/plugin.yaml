id: com.horizon.identity
version: 2.3.0
apiVersion: "1.0"
mode: builtin
managed: true
installation: system.identity
signIn:
  id: identity
  namespace: local
  default: true
extensions:
  - application
  - entity
  - capability
  - permission
  - event
permissions:
  - code: accounts:read
    module: identity
    function: accounts
    action: read
    scopeConfigurable: true
    temporaryEligible: true
  - code: accounts:create
    module: identity
    function: accounts
    action: create
    scopeConfigurable: true
    temporaryEligible: true
  - code: accounts:update
    module: identity
    function: accounts
    action: update
    scopeConfigurable: true
    temporaryEligible: true
  - code: accounts:delete
    module: identity
    function: accounts
    action: delete
    scopeConfigurable: true
    temporaryEligible: true
  - code: organizations:read
    module: identity
    function: organizations
    action: read
    scopeConfigurable: true
    temporaryEligible: true

  - code: organizations:update
    module: identity
    function: organizations
    action: update
    scopeConfigurable: true
    temporaryEligible: true

  - code: departments:read
    module: identity
    function: departments
    action: read
    scopeConfigurable: true
    temporaryEligible: true
  - code: departments:create
    module: identity
    function: departments
    action: create
    scopeConfigurable: true
    temporaryEligible: true
  - code: departments:update
    module: identity
    function: departments
    action: update
    scopeConfigurable: true
    temporaryEligible: true
  - code: departments:delete
    module: identity
    function: departments
    action: delete
    scopeConfigurable: true
    temporaryEligible: true
