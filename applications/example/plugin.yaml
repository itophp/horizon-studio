id: com.horizon.example
version: 1.0.2
apiVersion: "1.0"
mode: builtin
# The playground page is a deployment-baseline managed application package:
# reconcile installs and upgrades every tenant automatically.
managed: true
extensions:
  - capability
  - entity
  - permission
  - event
  - application
  - identity-type
identityTypes:
  - code: com.horizon.example.employee
    version: 1.0.0
    verify: example.record.get
    verifyVersion: 1.0.0
    revocationEvent: example.record.archived
  - code: com.horizon.example.supplier-contact
    version: 1.0.0
    verify: example.record.get
    verifyVersion: 1.0.0
    revocationEvent: example.record.archived
  - code: com.horizon.example.customer-contact
    version: 1.0.0
    verify: example.record.get
    verifyVersion: 1.0.0
    revocationEvent: example.record.archived
permissions:
  - code: example:read
    module: business
    function: example
    action: read
  - code: example:create
    module: business
    function: example
    action: create
  - code: example:archive
    module: business
    function: example
    action: archive
  - code: example-orders:read
    module: example-orders
    function: example-orders
    action: read
  - code: example-orders:write
    module: example-orders
    function: example-orders
    action: write
  - code: example-orders:manage
    module: example-orders
    function: example-orders
    action: manage
